# Production Configuration for Vercel

client_id = "0a5396ee55e709188d97bcbfffe50795"
application_url = "https://shopframe.karvocrm.store"
embedded = true
name = "shopframe"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[access_scopes]
scopes = "write_themes,read_themes"

[auth]
redirect_urls = [
  "https://shopframe.karvocrm.store/auth/callback",
  "https://shopframe.karvocrm.store/auth/shopify/callback",
  "https://shopframe.karvocrm.store/auth/tokens/callback",
  "https://shopframe.karvocrm.store/billing/callback",
]

[build]
# CRITICAL: Prevent local dev from overwriting this production config
automatically_update_urls_on_dev = false
