# Local Development Configuration
# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
client_id = "0a5396ee55e709188d97bcbfffe50795"
application_url = "https://shop-frame.vercel.app"
embedded = true
name = "shopframe"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_themes,read_themes"

[auth]
redirect_urls = [
  "https://shop-frame.vercel.app/auth/callback",
  "https://shop-frame.vercel.app/auth/shopify/callback",
  "https://shop-frame.vercel.app/auth/tokens/callback",
]

[build]
automatically_update_urls_on_dev = true
